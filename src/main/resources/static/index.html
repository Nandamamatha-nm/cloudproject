<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .delete {
            background: #dc2626;
        }

        .delete:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management</h1>

    <h3>Add User</h3>

    <input type="text" id="name" placeholder="Enter name">
    <input type="email" id="email" placeholder="Enter email">

    <button onclick="addUser()">Add User</button>

    <h3>Users</h3>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="userTable"></tbody>
    </table>

</div>

<script>

    async function loadUsers() {

        const response = await fetch('/users');

        const users = await response.json();

        const table = document.getElementById('userTable');

        table.innerHTML = '';

        users.forEach(user => {

            table.innerHTML += `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>
                        <button class="delete"
                                onclick="deleteUser(${user.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;

        });
    }


    async function addUser() {

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;

        if (!name || !email) {
            alert('Please enter name and email');
            return;
        }

        await fetch('/users', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                name: name,
                email: email
            })

        });

        document.getElementById('name').value = '';
        document.getElementById('email').value = '';

        loadUsers();
    }


    async function deleteUser(id) {

        await fetch('/users/' + id, {
            method: 'DELETE'
        });

        loadUsers();
    }


    loadUsers();

</script>

</body>
</html>
